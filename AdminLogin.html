<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{
            background:linear-gradient(135deg,#4b3621,#8b5e3c,#d2b48c);
            min-height:100vh;
        }

        .login-card{
            margin-top:70px;
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 10px 35px rgba(0,0,0,.3);
        }

        .left-side{

            background:linear-gradient(to bottom,#5d4037,#8d6e63);
            color:white;

            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;

            padding:40px;

        }

        .left-side img{

            width:120px;
            border-radius:50%;
            margin-bottom:20px;

        }

        .form-control{

            height:50px;
            border-radius:10px;

        }

        .input-group-text{

            background:#6f4e37;
            color:white;
            border:none;

        }

        .btn-login{

            width:100%;
            height:50px;
            background:#6f4e37;
            color:white;
            border:none;
            border-radius:10px;
            font-weight:bold;

        }

        .btn-login:hover{

            background:#4b3621;

        }

        .form-title{

            color:#6f4e37;
            font-weight:bold;

        }

    </style>
</head>
<body>
    <div class="container">
<br><br><br><br>
    <div class="row justify-content-center">
        <div class="col-lg-10 login-card">
            <div class="row">
                <div class="col-md-5 left-side">
                <img src="../static/img/images (1).jpeg">
                <h2>Brew Haven</h2>

                <p class="text-center">
                    Welcome back!
                        Login to continue enjoying your favourite coffee.
                </p>

            </div>

        <div class="col-md-7 p-5">

            <h2 class="form-title text-center mb-4">
            Admin Login
            </h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category,message in messages %}

            <div class="alert alert-{{category}}">
                {{message}}
            </div>

            {% endfor %}        
            {% endif %}
            {% endwith %}

<form action="/AdminLogin" method="POST">

    <div class="mb-3 input-group">

        <span class="input-group-text">
            <i class="bi bi-envelope-fill"></i>
        </span>

        <input type="email" name="email"class="form-control"placeholder="Email Address"required>
    </div>


    <div class="mb-4 input-group">
        <span class="input-group-text">
        <i class="bi bi-lock-fill"></i>
        </span>

        <input
        type="password"
        name="password"
        class="form-control"
        placeholder="Password"
        required>

    </div>


        <button class="btn-login">
        <i class="bi bi-box-arrow-in-right"></i>
        Login
        </button>

</form>


</div>

    </div>

    </div>

    </div>

</div>

</body>
</html>
