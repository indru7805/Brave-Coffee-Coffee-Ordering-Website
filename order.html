<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Brew Haven | Place Order</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: #f8f4ef;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #3b2417;
        }

        .order-card {
            width: 500px;
            max-width: 90%;

            background: white;

            padding: 40px;

            border-radius: 25px;

            box-shadow:
                0 15px 40px rgba(60, 35, 20, 0.15);
        }

        .order-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .order-title h1 {
            font-size: 32px;
            font-weight: 800;
            color: #5b321d;
        }

        .order-title p {
            color: #806b5d;
        }

        .coffee-name {
            text-align: center;

            font-size: 26px;

            font-weight: bold;

            color: #4a2919;

            margin-bottom: 25px;
        }

        .form-label {
            font-weight: bold;
            color: #5b321d;
        }

        .form-control {
            border: 1px solid #d8c5b5;

            border-radius: 10px;

            padding: 12px;

            font-size: 16px;
        }

        .form-control:focus {
            border-color: #b36b35;

            box-shadow:
                0 0 0 3px rgba(179, 107, 53, 0.15);
        }

        .total-box {
            background: #f8f0e8;

            border-radius: 12px;

            padding: 15px;

            margin-top: 20px;

            text-align: center;
        }

        .total-box p {
            margin-bottom: 5px;

            color: #806b5d;
        }

        .total-box h4 {
            margin: 0;

            color: #b36b35;

            font-weight: bold;

            font-size: 28px;
        }

        .place-order-btn {
            width: 100%;

            border: none;

            background: #5b321d;

            color: white;

            padding: 14px;

            border-radius: 12px;

            font-size: 17px;

            font-weight: bold;

            margin-top: 25px;

            transition: 0.3s;
        }

        .place-order-btn:hover {
            background: #b36b35;
        }

        .back-btn {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #5b321d;

            text-decoration: none;

            font-weight: bold;
        }

        .back-btn:hover {
            color: #b36b35;
        }

    </style>

</head>


<body>


<div class="order-card">


    <!-- TITLE -->

    <div class="order-title">

        <h1>
            ☕ Place Your Order
        </h1>

        <p>
            Complete your order details
        </p>

    </div>


    <!-- COFFEE NAME -->

    <div class="coffee-name">

        {{ item["Name"] }}

    </div>


    <!-- ORDER FORM -->

    <!-- IMPORTANT: /billing -->

    <form action="/billing" method="POST">


        <!-- NAME -->

        <div class="mb-3">

            <label class="form-label">
                Coffee Name
            </label>

            <input
                type="text"
                name="name"
                class="form-control"
                value="{{ item['Name'] }}"
                readonly
            >

        </div>


        <!-- PRICE -->

        <div class="mb-3">

            <label class="form-label">
                Price
            </label>

            <input
                type="number"
                name="price"
                class="form-control"
                value="{{ item['Price'] }}"
                readonly
            >

        </div>


        <!-- QUANTITY -->

        <div class="mb-3">

            <label class="form-label">
                Quantity
            </label>

            <input
                type="number"
                name="quantity"
                class="form-control"
                value="1"
                min="1"
                required
            >

        </div>


        <!-- TOTAL -->

        <div class="total-box">

            <p>
                Total Amount will be calculated on the billing page.
            </p>

            <h4>
                ${{ item['Price'] }}
            </h4>

        </div>


        <!-- CONTINUE TO BILLING -->

        <button
            type="submit"
            class="place-order-btn">

            ☕ Continue to Billing

        </button>


        <!-- BACK -->

        <a
            href="/Customerdashboard"
            class="back-btn">

            ← Back to Menu

        </a>


    </form>


</div>


</body>

</html>
